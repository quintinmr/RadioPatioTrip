# Compila la web (PWA) y el APK de Android.
# - En cada push a main: sube el APK de depuración como artefacto del workflow.
# - En cada tag vX.Y.Z: además publica una Release con el APK para descargarlo desde el móvil.
# Secretos necesarios (Settings -> Secrets and variables -> Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK (debug)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RadioPatioTrip.apk
      - uses: actions/upload-artifact@v4
        with: { name: RadioPatioTrip-apk, path: RadioPatioTrip.apk }
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RadioPatioTrip.apk
          generate_release_notes: true
