# Compila la web (PWA) y el APK de Android.
# - En cada push a main: sube el APK de depuración como artefacto del workflow.
# - En cada tag vX.Y.Z: además publica una Release con el APK para descargarlo desde el móvil.
# Secretos necesarios (Settings -> Secrets and variables -> Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Build web
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Clave de firma
        run: echo "$RP_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
        env: { RP_KEYSTORE_BASE64: "${{ secrets.RP_KEYSTORE_BASE64 }}" }
      - name: Build APK (release firmado)
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=${{ github.ref_name }}
        env:
          RP_KEYSTORE: ${{ runner.temp }}/release.jks
          RP_KEYSTORE_PASSWORD: ${{ secrets.RP_KEYSTORE_PASSWORD }}
          RP_KEY_ALIAS: ${{ secrets.RP_KEY_ALIAS }}
          RP_KEY_PASSWORD: ${{ secrets.RP_KEY_PASSWORD }}
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RadioPatioTrip.apk
      - uses: actions/upload-artifact@v4
        with: { name: RadioPatioTrip-apk, path: RadioPatioTrip.apk }
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RadioPatioTrip.apk
          generate_release_notes: true
