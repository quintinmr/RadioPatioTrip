# Publica la PWA en GitHub Pages (repo público o GitHub Pro).
# Activar una vez: Settings -> Pages -> Source: "GitHub Actions".
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Clave de firma
        run: echo "$RP_KEYSTORE_BASE64" | base64 -d > $RUNNER_TEMP/release.jks
        env: { RP_KEYSTORE_BASE64: "${{ secrets.RP_KEYSTORE_BASE64 }}" }
      # APK firmado (misma web empaquetada con Capacitor), se sirve desde la propia página
      - run: npm run build && npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=1.${{ github.run_number }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          RP_KEYSTORE: ${{ runner.temp }}/release.jks
          RP_KEYSTORE_PASSWORD: ${{ secrets.RP_KEYSTORE_PASSWORD }}
          RP_KEY_ALIAS: ${{ secrets.RP_KEY_ALIAS }}
          RP_KEY_PASSWORD: ${{ secrets.RP_KEY_PASSWORD }}
      # Web con base path de GitHub Pages + el APK al lado
      - run: npm run build && cp dist/index.html dist/404.html && cp android/app/build/outputs/apk/release/app-release.apk dist/RadioPatioTrip.apk
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
